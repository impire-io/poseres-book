<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Six masonry courses of motivation, widest at the bottom, each bracketed to a circular portrait of the failure it produces on its own.">
  <rect x="1" y="1" width="1198" height="798" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- each layer patches the one below -->
  <line x1="232" y1="752" x2="232" y2="106" stroke="#1b1f2c" stroke-width="3"/>
  <polygon points="232,86 244,112 220,112" fill="#1b1f2c"/>
  <text x="176" y="424" text-anchor="middle" transform="rotate(-90 176 424)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">each layer exists to patch the failure of the one below</text>

  <!-- course 6: imagination -->
  <rect x="380" y="100" width="360" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Imagination —</text>
  <text x="560" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">futures not yet lived</text>
  <path d="M 752 136 L 752 160 M 752 148 L 948 148" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,142 962,148 948,154" fill="#626779"/>

  <!-- twin: the dreamer -->
  <circle cx="1010" cy="138" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 138) scale(1.15) translate(-1010 -138)">
    <circle cx="1004" cy="124" r="12" fill="#ffffff" stroke="#626779" stroke-width="2"/>
    <circle cx="1020" cy="117" r="14" fill="#ffffff" stroke="#626779" stroke-width="2"/>
    <circle cx="1034" cy="126" r="11" fill="#ffffff" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="144" width="32" height="18" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="1006" y="147" width="5" height="12" fill="#1b1f2c"/>
  </g>
  <text x="1010" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the dreamer</text>

  <!-- course 5: borrowed goals -->
  <rect x="360" y="210" width="400" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Borrowed goals —</text>
  <text x="560" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what the parent wants</text>
  <path d="M 772 246 L 772 270 M 772 258 L 948 258" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,252 962,258 948,264" fill="#626779"/>

  <!-- twin: the sycophant -->
  <circle cx="1010" cy="248" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 248) scale(1.15) translate(-1010 -248)">
    <rect x="980" y="230" width="22" height="34" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="238" width="18" height="6" fill="#1b1f2c"/>
    <rect x="982" y="264" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="994" y="264" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="1010" y="222" width="22" height="14" rx="6" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="1014" y="238" width="22" height="14" rx="6" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <line x1="1034" y1="216" x2="1040" y2="210" stroke="#626779" stroke-width="2"/>
    <line x1="1042" y1="230" x2="1050" y2="228" stroke="#626779" stroke-width="2"/>
    <line x1="1004" y1="232" x2="1012" y2="228" stroke="#626779" stroke-width="2" stroke-dasharray="3 4"/>
  </g>
  <text x="1010" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the sycophant</text>

  <!-- course 4: completion itch -->
  <rect x="340" y="320" width="440" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Completion itch —</text>
  <text x="560" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">begun things want finishing</text>
  <path d="M 792 356 L 792 380 M 792 368 L 948 368" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,362 962,368 948,374" fill="#626779"/>

  <!-- twin: the grinder -->
  <circle cx="1010" cy="358" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 358) scale(1.15) translate(-1010 -358)">
    <rect x="1022" y="334" width="16" height="48" fill="#e3e1ec" stroke="#626779" stroke-width="2"/>
    <path d="M 1022 348 C 1034 353, 1034 363, 1022 368" fill="none" stroke="#626779" stroke-width="3"/>
    <rect x="980" y="340" width="22" height="34" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="348" width="18" height="6" fill="#1b1f2c"/>
    <rect x="982" y="374" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="994" y="374" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <path d="M 1004 350 C 1014 348, 1018 352, 1018 358" fill="none" stroke="#626779" stroke-width="3"/>
  </g>
  <text x="1010" y="418" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the grinder</text>

  <!-- course 3: option-value -->
  <rect x="320" y="430" width="480" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Option-value —</text>
  <text x="560" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">a log is money</text>
  <path d="M 812 466 L 812 490 M 812 478 L 948 478" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,472 962,478 948,484" fill="#626779"/>

  <!-- twin: the hoarder -->
  <circle cx="1010" cy="468" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 468) scale(1.15) translate(-1010 -468)">
    <rect x="980" y="450" width="22" height="34" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="458" width="18" height="6" fill="#1b1f2c"/>
    <rect x="976" y="470" width="18" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="996" y="470" width="18" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="1016" y="466" width="18" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="984" y="481" width="18" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="1004" y="481" width="18" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <rect x="972" y="481" width="10" height="9" rx="4" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
  </g>
  <text x="1010" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the hoarder</text>

  <!-- course 2: deficits -->
  <rect x="300" y="540" width="520" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Deficits —</text>
  <text x="560" y="610" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">hunger makes some things valuable now</text>
  <path d="M 832 566 L 832 590 M 832 578 L 948 578" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,572 962,578 948,584" fill="#626779"/>

  <!-- twin: the monomaniac -->
  <circle cx="1010" cy="578" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 578) scale(1.15) translate(-1010 -578)">
    <rect x="980" y="560" width="22" height="34" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="568" width="18" height="6" fill="#1b1f2c"/>
    <rect x="982" y="594" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="994" y="594" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <path d="M 1008 570 Q 1024 554, 1040 570 Q 1024 586, 1008 570 Z" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
    <circle cx="1024" cy="570" r="7" fill="#1b1f2c"/>
    <circle cx="1028" cy="598" r="9" fill="#ffffff" stroke="#626779" stroke-width="2.5"/>
    <line x1="1028" y1="591" x2="1030" y2="586" stroke="#626779" stroke-width="2"/>
  </g>
  <text x="1010" y="638" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the monomaniac</text>

  <!-- course 1: budget -->
  <rect x="280" y="650" width="560" height="96" fill="#c2410c" fill-opacity="0.10" stroke="#626779" stroke-width="2"/>
  <text x="560" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">Budget —</text>
  <text x="560" y="720" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">life aimed at the calorie</text>
  <path d="M 852 676 L 852 700 M 852 688 L 948 688" fill="none" stroke="#626779" stroke-width="2"/>
  <polygon points="948,682 962,688 948,694" fill="#626779"/>

  <!-- twin: the miser -->
  <circle cx="1010" cy="688" r="42" fill="#c2410c" fill-opacity="0.08" stroke="#cbc8da" stroke-width="2"/>
  <g transform="translate(1010 688) scale(1.15) translate(-1010 -688)">
    <rect x="980" y="670" width="22" height="34" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="982" y="678" width="18" height="6" fill="#1b1f2c"/>
    <rect x="982" y="704" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <rect x="994" y="704" width="6" height="6" fill="#cbc8da" stroke="#626779" stroke-width="2"/>
    <path d="M 1002 686 C 1012 682, 1020 684, 1022 690" fill="none" stroke="#626779" stroke-width="3"/>
    <path d="M 1002 696 C 1012 700, 1020 698, 1022 692" fill="none" stroke="#626779" stroke-width="3"/>
    <circle cx="1026" cy="691" r="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
    <circle cx="1026" cy="691" r="2" fill="#1b1f2c"/>
  </g>
  <text x="1010" y="748" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the miser</text>
</svg>
