<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="Four dictionary words defining one another in a closed grey ring, with a single warm arrow escaping to a foot stepping into water.">
  <rect x="1" y="1" width="1198" height="878" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- the closed ring -->
  <circle cx="600" cy="400" r="160" fill="none" stroke="#cbc8da" stroke-width="12"/>
  <polygon points="723.7,297.5 691.9,286.9 713.1,265.7" fill="#cbc8da"/>
  <polygon points="702.5,523.7 713.1,491.9 734.3,513.1" fill="#cbc8da"/>
  <polygon points="476.3,502.5 508.1,513.1 486.9,534.3" fill="#cbc8da"/>
  <polygon points="497.5,276.3 486.9,308.1 465.7,286.9" fill="#cbc8da"/>

  <!-- what sits at the empty centre -->
  <text x="600" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#626779">words pointing</text>
  <text x="600" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#626779">at words</text>

  <!-- top : water -->
  <rect x="480" y="132" width="240" height="92" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">&#8220;water&#8221;</text>
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">a clear liquid</text>

  <!-- right : liquid -->
  <rect x="776" y="354" width="300" height="92" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="926" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">&#8220;liquid&#8221;</text>
  <text x="926" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">a substance that flows</text>

  <!-- bottom : flow -->
  <rect x="440" y="576" width="320" height="92" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="600" y="614" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">&#8220;flow&#8221;</text>
  <text x="600" y="644" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">to move as a liquid does</text>

  <!-- left : move -->
  <rect x="164" y="354" width="260" height="92" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="294" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">&#8220;move&#8221;</text>
  <text x="294" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">to change position</text>

  <!-- the one way out -->
  <path d="M 480 178 C 358 188 148 254 122 384 C 110 486 140 528 194 550" fill="none" stroke="#c2410c" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="208.8,556.0 179.8,558.2 189.6,534.2" fill="#c2410c"/>

  <!-- the vignette : a bare foot stepping into water -->
  <line x1="138" y1="724" x2="178" y2="724" stroke="#1b1f2c" stroke-width="2.5"/>
  <line x1="422" y1="724" x2="462" y2="724" stroke="#1b1f2c" stroke-width="2.5"/>
  <ellipse cx="300" cy="730" rx="120" ry="17" fill="none" stroke="#1b1f2c" stroke-width="2.5"/>
  <ellipse cx="300" cy="730" rx="74" ry="11" fill="none" stroke="#1b1f2c" stroke-width="2"/>
  <path d="M 240 560 L 240 660 C 240 688 226 704 222 724 L 372 724 C 380 718 380 708 372 704 C 330 698 300 684 288 662 L 286 560 Z" fill="#ffffff" stroke="#1b1f2c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 168 704 C 172 696 177 692 182 688" fill="none" stroke="#1b1f2c" stroke-width="2" stroke-linecap="round"/>
  <path d="M 432 704 C 428 696 423 692 418 688" fill="none" stroke="#1b1f2c" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="790" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">something that once</text>
  <text x="300" y="818" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">splashed you</text>
</svg>
