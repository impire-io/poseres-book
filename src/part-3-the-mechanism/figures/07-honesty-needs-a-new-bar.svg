<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590">
  <rect x="1" y="1" width="1198" height="588" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

