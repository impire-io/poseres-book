  <polygon points="676 286 670 275 683 276" fill="#626779"/>

  <text x="600" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#c2410c">0 frames ever mature —</text>
  <text x="600" y="476" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#c2410c">newcomers churn endlessly,</text>
  <text x="600" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#c2410c">and the chosen size ratchets</text>
  <text x="600" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#c2410c">up to a median of 32.5</text>

