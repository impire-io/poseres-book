<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="Two stacked shape-curves: prediction of digging flattens as it is mastered, and the drive's wanting is the steepness of that curve, reaching zero where it levels off.">
  <rect x="1" y="1" width="1198" height="828" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- upper panel -->
  <text x="160" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">how well it predicts what digging does</text>
  <line x1="160" y1="120" x2="160" y2="320" stroke="#1b1f2c" stroke-width="2"/>
  <line x1="160" y1="320" x2="790" y2="320" stroke="#1b1f2c" stroke-width="2"/>
  <path d="M 160 140 C 230 210, 290 252, 370 272 C 450 290, 500 288, 560 290 L 760 290" fill="none" stroke="#1b1f2c" stroke-width="4"/>
  <text x="574" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#626779">mastered: predicts it cleanly now</text>

  <!-- the moment the era ends, through both panels -->
  <line x1="560" y1="120" x2="560" y2="600" stroke="#626779" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="574" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#626779">the era ends</text>

  <!-- lower panel -->
  <text x="160" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">how much the drive wants to be here</text>
  <line x1="160" y1="400" x2="160" y2="600" stroke="#1b1f2c" stroke-width="2"/>
  <line x1="160" y1="600" x2="790" y2="600" stroke="#1b1f2c" stroke-width="2"/>
  <path d="M 160 432 C 232 430, 282 470, 342 522 C 402 572, 482 600, 560 600 L 760 600" fill="none" stroke="#c2410c" stroke-width="4"/>
  <text x="475" y="638" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">time spent digging</text>

  <!-- away, to wherever prediction is still improving -->
  <ellipse cx="985" cy="490" rx="150" ry="80" fill="#e3e1ec" stroke="#cbc8da" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="985" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">somewhere else,<tspan x="985" dy="1.3em">where prediction is</tspan><tspan x="985" dy="1.3em">still improving</tspan></text>
  <path d="M 572 598 C 680 598, 762 560, 818 516" fill="none" stroke="#c2410c" stroke-width="4"/>
  <polygon points="810,530 832,506 800,504" fill="#c2410c"/>

  <!-- what the picture says -->
  <text x="600" y="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">the drive scores a place by whether its predictions there are still improving.<tspan x="600" dy="1.3em">Master something, and there is nothing left improving.</tspan></text>
  <text x="600" y="778" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">nothing anywhere in this design scores a log for being worth having.</text>
</svg>
