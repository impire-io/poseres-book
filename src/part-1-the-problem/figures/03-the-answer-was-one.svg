<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Paired bars: as the world's true size steps from 3 to 20, 35 and 50 knobs, the size the engine reported stays at one">
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <text x="140" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">knobs</text>

  <!-- plot area -->
  <rect x="140" y="180" width="800" height="380" fill="none" stroke="#e3e1ec" stroke-width="1.5"/>
  <g stroke="#e3e1ec" stroke-width="1">
    <line x1="140" y1="484" x2="940" y2="484"/>
    <line x1="140" y1="408" x2="940" y2="408"/>
    <line x1="140" y1="332" x2="940" y2="332"/>
    <line x1="140" y1="256" x2="940" y2="256"/>
  </g>

  <!-- true size -->
  <g fill="#cbc8da" stroke="#626779" stroke-width="1.5">
    <rect x="174" y="537.2" width="62" height="22.8"/>
    <rect x="374" y="408" width="62" height="152"/>
    <rect x="574" y="294" width="62" height="266"/>
    <rect x="774" y="180" width="62" height="380"/>
  </g>

  <!-- size the engine reported -->
  <g fill="#c2410c">
    <rect x="244" y="537.2" width="62" height="22.8"/>
    <rect x="444" y="552.4" width="62" height="7.6"/>
    <rect x="644" y="552.4" width="62" height="7.6"/>
    <rect x="844" y="552.4" width="62" height="7.6"/>
  </g>

  <!-- callout: the three stubs -->
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#626779"/>
    </marker>
  </defs>
  <g stroke="#626779" stroke-width="1.5" fill="none">
    <line x1="475" y1="160" x2="875" y2="160"/>
    <line x1="475" y1="160" x2="475" y2="546" marker-end="url(#tip)"/>
    <line x1="675" y1="160" x2="675" y2="546" marker-end="url(#tip)"/>
    <line x1="875" y1="160" x2="875" y2="546" marker-end="url(#tip)"/>
  </g>
  <text x="675" y="144" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">reported 1</text>

  <!-- direct labels -->
  <g stroke="#626779" stroke-width="1.5">
    <line x1="605" y1="282" x2="605" y2="292"/>
    <line x1="944" y1="512" x2="912" y2="549"/>
  </g>
  <text x="605" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">true size</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">
    <text x="950" y="500">size the engine</text>
    <text x="950" y="526">reported</text>
  </g>

  <!-- axes -->
  <g stroke="#1b1f2c" stroke-width="1.5">
    <line x1="140" y1="560" x2="940" y2="560"/>
    <line x1="140" y1="560" x2="140" y2="180"/>
    <line x1="240" y1="560" x2="240" y2="566"/>
    <line x1="440" y1="560" x2="440" y2="566"/>
    <line x1="640" y1="560" x2="640" y2="566"/>
    <line x1="840" y1="560" x2="840" y2="566"/>
    <line x1="134" y1="560" x2="140" y2="560"/>
    <line x1="134" y1="484" x2="140" y2="484"/>
    <line x1="134" y1="408" x2="140" y2="408"/>
    <line x1="134" y1="332" x2="140" y2="332"/>
    <line x1="134" y1="256" x2="140" y2="256"/>
    <line x1="134" y1="180" x2="140" y2="180"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#626779" text-anchor="end">
    <text x="126" y="567">0</text>
    <text x="126" y="491">10</text>
    <text x="126" y="415">20</text>
    <text x="126" y="339">30</text>
    <text x="126" y="263">40</text>
    <text x="126" y="187">50</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#626779" text-anchor="middle">
    <text x="240" y="590">3</text>
    <text x="440" y="590">20</text>
    <text x="640" y="590">35</text>
    <text x="840" y="590">50</text>
  </g>

  <text x="540" y="628" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">world's true size (knobs)</text>

  <path d="M 374 650 L 374 660 L 906 660 L 906 650" fill="none" stroke="#cbc8da" stroke-width="2"/>
  <text x="640" y="692" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#626779">the new, larger worlds</text>
</svg>
