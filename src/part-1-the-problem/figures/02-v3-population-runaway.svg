<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect x="1" y="1" width="1198" height="698" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <text x="140" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#1b1f2c">Prototype v3 — population over 30 cycles</text>
  <text x="140" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">number of models alive</text>

  <!-- plot area -->
  <rect x="140" y="180" width="860" height="380" fill="none" stroke="#e3e1ec" stroke-width="1.5"/>
  <g stroke="#e3e1ec" stroke-width="1">
    <line x1="140" y1="441" x2="1000" y2="441"/>
    <line x1="140" y1="323" x2="1000" y2="323"/>
    <line x1="140" y1="204" x2="1000" y2="204"/>
  </g>

  <!-- what a working eviction rule should look like -->
  <path d="M 140 560 C 200 520 250 430 328 392 C 380 372 420 368 480 366 L 1000 366" fill="none" stroke="#626779" stroke-width="2.5" stroke-dasharray="10 8"/>
  <line x1="620" y1="410" x2="620" y2="372" stroke="#626779" stroke-width="1.5"/>
  <text x="555" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what a working eviction rule should look like</text>

  <!-- v3: one new model per cycle, straight off the top-right corner -->
  <path d="M 140 560 L 1055 156" fill="none" stroke="#c2410c" stroke-width="3"/>
  <line x1="540" y1="258" x2="690" y2="308" stroke="#626779" stroke-width="1.5"/>
  <text x="200" y="250" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">v3: +1 per cycle, no plateau</text>

  <!-- axes -->
  <g stroke="#1b1f2c" stroke-width="1.5">
    <line x1="140" y1="560" x2="1000" y2="560"/>
    <line x1="140" y1="560" x2="140" y2="180"/>
    <line x1="140" y1="560" x2="140" y2="566"/>
    <line x1="409" y1="560" x2="409" y2="566"/>
    <line x1="678" y1="560" x2="678" y2="566"/>
    <line x1="946" y1="560" x2="946" y2="566"/>
    <line x1="134" y1="560" x2="140" y2="560"/>
    <line x1="134" y1="441" x2="140" y2="441"/>
    <line x1="134" y1="323" x2="140" y2="323"/>
    <line x1="134" y1="204" x2="140" y2="204"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#626779" text-anchor="middle">
    <text x="140" y="590">0</text>
    <text x="409" y="590">10</text>
    <text x="678" y="590">20</text>
    <text x="946" y="590">30</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#626779" text-anchor="end">
    <text x="126" y="567">0</text>
    <text x="126" y="448">10</text>
    <text x="126" y="330">20</text>
    <text x="126" y="211">30</text>
  </g>

  <text x="570" y="625" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">cycle</text>
</svg>
