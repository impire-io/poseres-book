    <circle cx="954" cy="371" r="9"/>
    <line x1="954" y1="371" x2="958.5" y2="363.2"/>
    <circle cx="980" cy="371" r="9"/>
    <line x1="980" y1="371" x2="984.5" y2="363.2"/>
    <circle cx="1006" cy="371" r="9"/>
    <line x1="1006" y1="371" x2="1010.5" y2="363.2"/>
    <circle cx="1032" cy="371" r="9"/>
    <line x1="1032" y1="371" x2="1036.5" y2="363.2"/>
    <circle cx="1058" cy="371" r="9"/>
    <line x1="1058" y1="371" x2="1062.5" y2="363.2"/>
