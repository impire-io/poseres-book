    <circle cx="1058" cy="319" r="9"/>
    <line x1="1058" y1="319" x2="1062.5" y2="311.2"/>
    <circle cx="1084" cy="319" r="9"/>
    <line x1="1084" y1="319" x2="1088.5" y2="311.2"/>
    <circle cx="1110" cy="319" r="9"/>
    <line x1="1110" y1="319" x2="1114.5" y2="311.2"/>

    <circle cx="928" cy="345" r="9"/>
    <line x1="928" y1="345" x2="932.5" y2="337.2"/>
    <circle cx="954" cy="345" r="9"/>
    <line x1="954" y1="345" x2="958.5" y2="337.2"/>
    <circle cx="980" cy="345" r="9"/>
    <line x1="980" y1="345" x2="984.5" y2="337.2"/>
    <circle cx="1006" cy="345" r="9"/>
    <line x1="1006" y1="345" x2="1010.5" y2="337.2"/>
    <circle cx="1032" cy="345" r="9"/>
