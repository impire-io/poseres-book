<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Four control panels with 1, 3, 5 and more than twenty knobs, for a swing, a boat, a drone and a hand">
  <rect x="1" y="1" width="1198" height="518" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <text x="600" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#1b1f2c">How many knobs to describe it completely?</text>

  <!-- swing icon -->
  <g stroke="#1b1f2c" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="110" y1="168" x2="210" y2="168"/>
    <line x1="110" y1="168" x2="92" y2="258"/>
    <line x1="210" y1="168" x2="228" y2="258"/>
    <line x1="138" y1="168" x2="138" y2="236"/>
    <line x1="182" y1="168" x2="182" y2="236"/>
    <rect x="130" y="236" width="60" height="10" rx="4" fill="#ffffff"/>
  </g>

  <!-- boat icon, seen from above -->
  <g stroke="#1b1f2c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 440 166 C 470 200 476 232 470 254 L 410 254 C 404 232 410 200 440 166 Z" fill="#ffffff"/>
    <line x1="416" y1="208" x2="464" y2="208"/>
    <line x1="412" y1="234" x2="468" y2="234"/>
  </g>

  <!-- drone icon -->
  <g stroke="#1b1f2c" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="706" y1="196" x2="668" y2="172"/>
    <line x1="734" y1="196" x2="772" y2="172"/>
    <line x1="706" y1="224" x2="668" y2="248"/>
    <line x1="734" y1="224" x2="772" y2="248"/>
    <circle cx="668" cy="172" r="17" fill="#ffffff"/>
    <circle cx="772" cy="172" r="17" fill="#ffffff"/>
    <circle cx="668" cy="248" r="17" fill="#ffffff"/>
    <circle cx="772" cy="248" r="17" fill="#ffffff"/>
    <rect x="702" y="192" width="36" height="36" rx="8" fill="#ffffff"/>
  </g>

  <!-- hand icon -->
  <g stroke="#1b1f2c" stroke-width="3" fill="#ffffff">
    <rect x="926" y="232" width="44" height="17" rx="8.5" transform="rotate(22 970 240)"/>
    <rect x="964" y="176" width="16" height="46" rx="8"/>
    <rect x="983" y="164" width="16" height="58" rx="8"/>
    <rect x="1002" y="168" width="16" height="54" rx="8"/>
    <rect x="1021" y="184" width="16" height="38" rx="8"/>
    <rect x="962" y="212" width="76" height="54" rx="14"/>
  </g>

  <!-- faceplates -->
  <g fill="#ffffff" stroke="#1b1f2c" stroke-width="2.5">
    <rect x="55" y="290" width="210" height="110" rx="10"/>
    <rect x="335" y="290" width="210" height="110" rx="10"/>
    <rect x="615" y="290" width="210" height="110" rx="10"/>
    <rect x="895" y="290" width="210" height="110" rx="10"/>
  </g>

  <!-- knobs: one dial, one dimension -->
  <g fill="#ffffff" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round">
    <circle cx="160" cy="345" r="14"/>
    <line x1="160" y1="345" x2="167" y2="333"/>

    <circle cx="384" cy="345" r="14"/>
    <line x1="384" y1="345" x2="391" y2="333"/>
    <circle cx="440" cy="345" r="14"/>
    <line x1="440" y1="345" x2="447" y2="333"/>
    <circle cx="496" cy="345" r="14"/>
    <line x1="496" y1="345" x2="503" y2="333"/>

    <circle cx="644" cy="345" r="14"/>
    <line x1="644" y1="345" x2="651" y2="333"/>
    <circle cx="682" cy="345" r="14"/>
    <line x1="682" y1="345" x2="689" y2="333"/>
    <circle cx="720" cy="345" r="14"/>
    <line x1="720" y1="345" x2="727" y2="333"/>
    <circle cx="758" cy="345" r="14"/>
    <line x1="758" y1="345" x2="765" y2="333"/>
    <circle cx="796" cy="345" r="14"/>
    <line x1="796" y1="345" x2="803" y2="333"/>
  </g>

