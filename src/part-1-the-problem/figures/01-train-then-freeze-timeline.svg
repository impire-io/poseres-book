<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <rect x="1" y="1" width="1198" height="838" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- panel headings -->
  <text x="70" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1b1f2c">TRAINING — in the lab</text>
  <text x="678" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1b1f2c">DEPLOYMENT — in the world</text>

  <!-- the two panels -->
  <rect x="70" y="125" width="590" height="520" rx="8" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <rect x="660" y="125" width="350" height="520" rx="8" fill="#e8edf5" stroke="#cbc8da" stroke-width="2"/>

  <!-- stacked example documents feeding the rising line -->
  <g fill="#ffffff" stroke="#626779" stroke-width="2">
    <rect x="156" y="534" width="44" height="56" rx="4"/>
    <rect x="162" y="540" width="44" height="56" rx="4"/>
    <rect x="168" y="546" width="44" height="56" rx="4"/>
    <rect x="326" y="534" width="44" height="56" rx="4"/>
    <rect x="332" y="540" width="44" height="56" rx="4"/>
    <rect x="338" y="546" width="44" height="56" rx="4"/>
    <rect x="496" y="534" width="44" height="56" rx="4"/>
    <rect x="502" y="540" width="44" height="56" rx="4"/>
    <rect x="508" y="546" width="44" height="56" rx="4"/>
  </g>
  <g stroke="#626779" stroke-width="1.5" stroke-linecap="round">
    <line x1="176" y1="560" x2="204" y2="560"/>
    <line x1="176" y1="572" x2="204" y2="572"/>
    <line x1="176" y1="584" x2="204" y2="584"/>
    <line x1="346" y1="560" x2="374" y2="560"/>
    <line x1="346" y1="572" x2="374" y2="572"/>
    <line x1="346" y1="584" x2="374" y2="584"/>
    <line x1="516" y1="560" x2="544" y2="560"/>
    <line x1="516" y1="572" x2="544" y2="572"/>
    <line x1="516" y1="584" x2="544" y2="584"/>
  </g>

  <!-- feed arrows from the documents up into the line -->
  <g stroke="#626779" stroke-width="2" fill="#626779">
    <line x1="180" y1="526" x2="180" y2="474"/>
    <polygon points="180,462 173,474 187,474"/>
    <line x1="350" y1="526" x2="350" y2="402"/>
    <polygon points="350,390 343,402 357,402"/>
    <line x1="520" y1="526" x2="520" y2="314"/>
    <polygon points="520,302 513,314 527,314"/>
  </g>
  <text x="350" y="632" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">examples</text>

  <!-- what the brain knows: rising in the lab, flat in the world -->
  <path d="M 110 480 C 220 455 300 405 390 355 S 560 265 660 230" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <line x1="660" y1="230" x2="1010" y2="230" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>

  <!-- frost on the flat stretch -->
  <g stroke="#0f62c4" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round">
    <line x1="700" y1="218" x2="700" y2="242"/>
    <line x1="689.6" y1="224" x2="710.4" y2="236"/>
    <line x1="689.6" y1="236" x2="710.4" y2="224"/>
    <line x1="770" y1="218" x2="770" y2="242"/>
    <line x1="759.6" y1="224" x2="780.4" y2="236"/>
    <line x1="759.6" y1="236" x2="780.4" y2="224"/>
    <line x1="840" y1="218" x2="840" y2="242"/>
    <line x1="829.6" y1="224" x2="850.4" y2="236"/>
    <line x1="829.6" y1="236" x2="850.4" y2="224"/>
    <line x1="910" y1="218" x2="910" y2="242"/>
    <line x1="899.6" y1="224" x2="920.4" y2="236"/>
    <line x1="899.6" y1="236" x2="920.4" y2="224"/>
    <line x1="980" y1="218" x2="980" y2="242"/>
    <line x1="969.6" y1="224" x2="990.4" y2="236"/>
    <line x1="969.6" y1="236" x2="990.4" y2="224"/>
  </g>

  <text x="170" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">what the brain knows</text>
  <line x1="300" y1="328" x2="325" y2="378" stroke="#626779" stroke-width="1.5"/>

  <!-- the learning switch, off -->
  <rect x="690" y="166" width="52" height="28" rx="14" fill="#ffffff" stroke="#626779" stroke-width="2"/>
  <circle cx="704" cy="180" r="9" fill="#626779"/>
  <text x="754" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">learning: off</text>

  <!-- pressures from outside, pointing at the flat line -->
  <g stroke="#0f62c4" stroke-width="2.5" fill="#0f62c4">
    <line x1="1054" y1="161" x2="1022.8" y2="206.1"/>
    <polygon points="1016,216 1027.8,209.6 1017.9,202.7"/>
    <line x1="1054" y1="230" x2="1028" y2="230"/>
    <polygon points="1016,230 1028,224.5 1028,235.5"/>
    <line x1="1054" y1="299" x2="1022.8" y2="253.9"/>
    <polygon points="1016,244 1017.9,257.3 1027.8,250.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c" text-anchor="end">
    <text x="1151" y="148">world<tspan x="1151" dy="1.3em">changes</tspan></text>
    <text x="1151" y="217">task<tspan x="1151" dy="1.3em">changes</tspan></text>
    <text x="1151" y="291">body<tspan x="1151" dy="1.3em">changes</tspan></text>
  </g>

  <!-- the cut -->
  <line x1="660" y1="80" x2="660" y2="740" stroke="#1b1f2c" stroke-width="4"/>

  <!-- the timeline -->
  <line x1="70" y1="700" x2="1132" y2="700" stroke="#1b1f2c" stroke-width="3"/>
  <polygon points="1146,700 1130,692 1130,708" fill="#1b1f2c"/>
  <circle cx="660" cy="700" r="7" fill="#1b1f2c"/>
  <text x="1140" y="740" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">time</text>

  <text x="660" y="770" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">the copy that ships</text>
</svg>
