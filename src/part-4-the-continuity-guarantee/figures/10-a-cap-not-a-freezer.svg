<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <rect x="1" y="1" width="1198" height="858" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>
  <defs>
    <marker id="cf-dim" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><path d="M0 0 L12 4.5 L0 9 Z" fill="#626779"/></marker>
    <marker id="cf-ink" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0 0 L13 5 L0 10 Z" fill="#1b1f2c"/></marker>
    <marker id="cf-amber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0 0 L15 6 L0 12 Z" fill="#c2410c"/></marker>
  </defs>

  <polygon points="162,124 254,116 276,176 260,242 176,246 156,186" fill="#e8edf5" stroke="#0f62c4" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M176 132 L206 240 M244 122 L262 200 M160 190 L272 172" stroke="#0f62c4" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M200 176 A16 16 0 0 1 232 176" fill="none" stroke="#626779" stroke-width="4"/>
  <rect x="194" y="176" width="44" height="36" rx="6" fill="#e8edf5" stroke="#626779" stroke-width="2.5"/>
  <circle cx="216" cy="192" r="4" fill="#626779"/>
  <path d="M156 117 L276 243 M276 117 L156 243" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>

  <circle cx="600" cy="180" r="8" fill="#1b1f2c"/>
  <path d="M528 180 H586" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M556 136 L590 170" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M600 114 V166" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M635 145 L610 170" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M670 180 H614" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M627 207 L611 191" fill="none" stroke="#1b1f2c" stroke-width="3.5" marker-end="url(#cf-ink)"/>
  <path d="M540 117 L660 243 M660 117 L540 243" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>

  <circle cx="930" cy="180" r="44" fill="#ffffff" stroke="#1b1f2c" stroke-width="2.5"/>
  <path d="M930 142 V150 M968 180 H960 M930 218 V210 M892 180 H900" stroke="#1b1f2c" stroke-width="2"/>
  <path d="M930 180 L930 152 M930 180 L952 190" stroke="#1b1f2c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="930" cy="180" r="3.5" fill="#1b1f2c"/>
  <path d="M930 126 A54 54 0 1 1 879 162" fill="none" stroke="#626779" stroke-width="2.5" marker-end="url(#cf-dim)"/>
  <path d="M1000 138 V150 M1092 138 V150 M1000 144 H1092" stroke="#626779" stroke-width="2.5"/>
  <path d="M1000 174 V186 M1058 174 V186 M1000 180 H1058" stroke="#626779" stroke-width="2.5"/>
  <path d="M1000 210 V222 M1026 210 V222 M1000 216 H1026" stroke="#626779" stroke-width="2.5"/>
  <path d="M924 117 L1044 243 M1044 117 L924 243" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>

  <text x="216" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">freeze it — that's a</text>
  <text x="216" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">frozen brain again</text>

  <text x="600" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">shrink every number</text>
  <text x="600" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">toward zero — punishes</text>
  <text x="600" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">healthy ones too</text>

  <text x="984" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">slow its learning as</text>
  <text x="984" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">it ages — freezing</text>
  <text x="984" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">with extra steps</text>

  <path d="M48 374 H1152" stroke="#e3e1ec" stroke-width="2"/>

  <text x="600" y="412" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">the ceiling: a little above the size it was born at</text>
  <path d="M600 422 V470" fill="none" stroke="#cbc8da" stroke-width="1.6"/>

  <rect x="48" y="440" width="336" height="260" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <circle cx="216" cy="570" r="92" fill="none" stroke="#1b1f2c" stroke-width="3"/>
  <circle cx="216" cy="570" r="4" fill="#1b1f2c"/>
  <path d="M216 570 L252 545" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#cf-amber)"/>

  <path d="M400 558 L414 570 L400 582" fill="none" stroke="#cbc8da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="432" y="440" width="336" height="260" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <circle cx="600" cy="570" r="92" fill="none" stroke="#1b1f2c" stroke-width="3"/>
  <circle cx="600" cy="570" r="4" fill="#1b1f2c"/>
  <path d="M600 570 L701 499" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#cf-amber)"/>

  <path d="M784 558 L798 570 L784 582" fill="none" stroke="#cbc8da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="440" width="336" height="260" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <circle cx="984" cy="570" r="92" fill="none" stroke="#1b1f2c" stroke-width="3"/>
  <circle cx="984" cy="570" r="4" fill="#1b1f2c"/>
  <path d="M1085 499 L1069 510" fill="none" stroke="#cbc8da" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#cf-dim)"/>
  <path d="M984 570 L1055 520" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#cf-amber)"/>

  <text x="216" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">learning moves it —</text>
  <text x="216" y="766" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">nothing happens</text>

  <text x="600" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">learning pushes it</text>
  <text x="600" y="766" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">past the ceiling</text>

  <text x="984" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">scaled back onto</text>
  <text x="984" y="766" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">the ceiling: same</text>
  <text x="984" y="792" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">direction, shorter</text>
</svg>
