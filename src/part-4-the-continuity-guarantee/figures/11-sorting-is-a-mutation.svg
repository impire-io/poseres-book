<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="The same five numbers added in two different orders give results that differ in the final digit only.">
  <rect x="1" y="1" width="1198" height="578" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- ROW 1: the order it was lived in -->
  <text x="70" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">the order it was lived in</text>

  <rect x="70" y="155" width="124" height="70" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="132" y="197" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.9481</text>
  <text x="214" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="234" y="164" width="96" height="52" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="282" y="197" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.1372</text>
  <text x="350" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="370" y="145" width="156" height="90" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="448" y="197" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.7734</text>
  <text x="546" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="566" y="160" width="108" height="60" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="620" y="197" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.2065</text>
  <text x="694" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="714" y="151" width="136" height="78" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="782" y="197" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.4118</text>
  <text x="872" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">=</text>

  <text x="894" y="197" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">2.4770193481047625</text>
  <rect x="1096" y="178" width="18" height="26" rx="3" fill="none" stroke="#c2410c" stroke-width="2"/>

  <!-- the magnifier over the two final digits -->
  <text x="925" y="280" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">one ULP: the smallest step a computer's numbers can take</text>
  <line x1="959" y1="336" x2="935" y2="360" stroke="#626779" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1000" cy="295" r="58" fill="#ffffff" stroke="#626779" stroke-width="4"/>
  <text x="1000" y="288" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="34" fill="#c2410c">5</text>
  <line x1="962" y1="300" x2="1038" y2="300" stroke="#e3e1ec" stroke-width="2"/>
  <text x="1000" y="340" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="34" fill="#c2410c">7</text>
  <line x1="1039" y1="252" x2="1090" y2="198" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="1039" y1="338" x2="1090" y2="394" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ROW 2: the order the snapshot wrote them -->
  <text x="70" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">the order the snapshot wrote them: sorted by size</text>

  <rect x="70" y="374" width="96" height="52" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="118" y="407" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.1372</text>
  <text x="186" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="206" y="370" width="108" height="60" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="260" y="407" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.2065</text>
  <text x="334" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="354" y="365" width="124" height="70" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="416" y="407" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.9481</text>
  <text x="498" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="518" y="361" width="136" height="78" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="586" y="407" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.4118</text>
  <text x="674" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">+</text>

  <rect x="694" y="355" width="156" height="90" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="772" y="407" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">0.7734</text>
  <text x="872" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#626779">=</text>

  <text x="894" y="407" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">2.4770193481047627</text>
  <rect x="1096" y="388" width="18" height="26" rx="3" fill="none" stroke="#c2410c" stroke-width="2"/>

  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#1b1f2c">sorting is a mutation</text>
</svg>
