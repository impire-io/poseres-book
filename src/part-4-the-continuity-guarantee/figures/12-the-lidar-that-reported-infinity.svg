<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Non-finite lidar readings flow into the running error statistics, turn every accumulator to nan, and the run still reports success.">
  <rect x="1" y="1" width="1198" height="578" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <!-- STAGE 1: the room -->
  <line x1="80" y1="140" x2="400" y2="140" stroke="#1b1f2c" stroke-width="3"/>
  <line x1="80" y1="140" x2="80" y2="380" stroke="#1b1f2c" stroke-width="3"/>
  <line x1="80" y1="380" x2="400" y2="380" stroke="#1b1f2c" stroke-width="3"/>
  <line x1="400" y1="140" x2="400" y2="200" stroke="#1b1f2c" stroke-width="3"/>
  <line x1="400" y1="250" x2="400" y2="380" stroke="#1b1f2c" stroke-width="3"/>

  <line x1="219" y1="310" x2="362" y2="140" stroke="#0f62c4" stroke-width="1.5"/>
  <line x1="219" y1="310" x2="400" y2="225" stroke="#0f62c4" stroke-width="1.5"/>
  <line x1="400" y1="225" x2="500" y2="178" stroke="#0f62c4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="219" y1="310" x2="237" y2="314" stroke="#0f62c4" stroke-width="1.5"/>
  <rect x="238" y="308" width="14" height="14" fill="#1b1f2c"/>

  <rect x="156" y="290" width="12" height="7" rx="2" fill="#626779"/>
  <rect x="178" y="290" width="12" height="7" rx="2" fill="#626779"/>
  <rect x="156" y="323" width="12" height="7" rx="2" fill="#626779"/>
  <rect x="178" y="323" width="12" height="7" rx="2" fill="#626779"/>
  <rect x="148" y="294" width="44" height="32" rx="9" fill="#ffffff" stroke="#1b1f2c" stroke-width="2.5"/>
  <rect x="193" y="292" width="6" height="36" rx="3" fill="#1b1f2c"/>

  <text x="322" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">3.4</text>
  <line x1="345" y1="134" x2="356" y2="146" stroke="#cbc8da" stroke-width="2"/>
  <text x="412" y="145" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">∞ (no hit)</text>
  <line x1="430" y1="152" x2="436" y2="202" stroke="#cbc8da" stroke-width="2"/>
  <text x="92" y="365" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">−∞ (below minimum range)</text>
  <line x1="252" y1="348" x2="250" y2="326" stroke="#cbc8da" stroke-width="2"/>

  <!-- STAGE 2: the running error statistics -->
  <line x1="404" y1="270" x2="440" y2="270" stroke="#cbc8da" stroke-width="2"/>
  <rect x="440" y="258" width="120" height="24" rx="12" fill="#e8edf5" stroke="#cbc8da" stroke-width="2"/>
  <text x="500" y="279" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" fill="#1b1f2c">∞</text>

  <text x="698" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1b1f2c">running error statistics</text>

  <rect x="560" y="240" width="60" height="60" rx="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="590" y="277" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">nan</text>
  <polygon points="632,270 620,264 620,276" fill="#626779"/>

  <rect x="632" y="240" width="60" height="60" rx="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="662" y="277" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">nan</text>
  <polygon points="704,270 692,264 692,276" fill="#626779"/>

  <rect x="704" y="240" width="60" height="60" rx="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="734" y="277" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">nan</text>
  <polygon points="776,270 764,264 764,276" fill="#626779"/>

  <rect x="776" y="240" width="60" height="60" rx="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="806" y="277" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">nan</text>

  <line x1="840" y1="270" x2="866" y2="270" stroke="#626779" stroke-width="2"/>
  <polygon points="876,270 864,264 864,276" fill="#626779"/>

  <!-- STAGE 3: the monitor -->
  <rect x="880" y="190" width="270" height="170" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2.5"/>
  <path d="M 996 232 L 1008 246 L 1034 216" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1015" y="288" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">exit code: success</text>
  <rect x="890" y="304" width="250" height="34" rx="4" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>
  <text x="1015" y="327" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#1b1f2c">nan early → nan late</text>
  <rect x="995" y="360" width="40" height="14" fill="#cbc8da"/>
  <line x1="975" y1="378" x2="1055" y2="378" stroke="#626779" stroke-width="3"/>

  <!-- caption -->
  <rect x="60" y="460" width="1080" height="58" rx="8" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="600" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">the dashboard looked healthy; the numbers were garbage</text>
</svg>
