    <text x="269" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what goes in</text>
    <path d="M68 304 C150 304, 190 300, 224 262 C250 232, 288 138, 314 108 C348 68, 388 66, 470 66" fill="none" stroke="#1b1f2c" stroke-width="2.5"/>
    <path d="M68 185 H269 M315 108 H68" fill="none" stroke="#cbc8da" stroke-width="1.4" stroke-dasharray="6 6"/>
    <path d="M269 185 H311" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#na-md)"/>
    <path d="M315 185 V114" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#na-md)"/>
    <circle cx="269" cy="185" r="7" fill="#1b1f2c"/>
    <circle cx="315" cy="108" r="6" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  </g>

  <g transform="translate(628,150)">
    <rect x="0" y="0" width="512" height="410" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
    <text x="34" y="185" text-anchor="middle" transform="rotate(-90 34 185)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what comes out</text>
    <path d="M68 40 V330 H470" fill="none" stroke="#1b1f2c" stroke-width="1.6"/>
    <text x="269" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what goes in</text>
    <path d="M68 304 C150 304, 190 300, 224 262 C250 232, 288 138, 314 108 C348 68, 388 66, 470 66" fill="none" stroke="#1b1f2c" stroke-width="2.5"/>
    <path d="M68 66 H400" fill="none" stroke="#cbc8da" stroke-width="1.4" stroke-dasharray="6 6"/>
    <path d="M400 66 H442" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#na-md)"/>
