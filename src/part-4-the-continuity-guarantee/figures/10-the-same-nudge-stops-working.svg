  </defs>

  <text x="316" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">small numbers inside:</text>
  <text x="316" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">a nudge changes the answer</text>
  <text x="884" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">bloated numbers inside:</text>
  <text x="884" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">the same nudge changes nothing</text>

  <g transform="translate(60,150)">
    <rect x="0" y="0" width="512" height="410" rx="12" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
    <text x="34" y="185" text-anchor="middle" transform="rotate(-90 34 185)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">what comes out</text>
