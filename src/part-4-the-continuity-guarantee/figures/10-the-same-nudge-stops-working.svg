<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <rect x="1" y="1" width="1198" height="838" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>
  <defs>
    <marker id="na-sm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#c2410c"/></marker>
    <marker id="na-md" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto"><path d="M0 0 L14 5.5 L0 11 Z" fill="#c2410c"/></marker>
