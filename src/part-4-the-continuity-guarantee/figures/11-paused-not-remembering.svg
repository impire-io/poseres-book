<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A continuously learning run is paused at a consolidation boundary, written to a file, and resumed identically on two machines.">
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="#f8f7fb" stroke="#e3e1ec" stroke-width="2"/>

  <text x="90" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">one run, learning continuously</text>

  <!-- the lane, up to the pause -->
  <rect x="90" y="140" width="340" height="60" rx="6" fill="#ffffff" stroke="#e3e1ec" stroke-width="2"/>
  <polyline points="90,174 111,158 132,180 153,162 174,186 195,156 216,178 237,160 258,184 279,166 300,158 321,182 342,164 363,186 384,156 405,178 426,168" fill="none" stroke="#c2410c" stroke-width="2.5"/>

  <line x1="130" y1="200" x2="130" y2="214" stroke="#626779" stroke-width="2"/>
  <line x1="190" y1="200" x2="190" y2="214" stroke="#626779" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="214" stroke="#626779" stroke-width="2"/>
  <line x1="310" y1="200" x2="310" y2="214" stroke="#626779" stroke-width="2"/>
  <line x1="370" y1="200" x2="370" y2="214" stroke="#626779" stroke-width="2"/>
  <line x1="250" y1="216" x2="250" y2="228" stroke="#cbc8da" stroke-width="2"/>
  <text x="250" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#626779">consolidation boundaries</text>

  <!-- the pause bar -->
  <rect x="424" y="130" width="12" height="82" fill="#1b1f2c"/>
  <line x1="430" y1="218" x2="430" y2="262" stroke="#1b1f2c" stroke-width="2.5"/>
  <polygon points="424,262 436,262 430,274" fill="#1b1f2c"/>

  <!-- the file -->
  <path d="M 380 277 L 450 277 L 480 307 L 480 377 L 380 377 Z" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <path d="M 450 277 L 450 307 L 480 307" fill="none" stroke="#1b1f2c" stroke-width="2"/>
  <line x1="396" y1="327" x2="464" y2="327" stroke="#cbc8da" stroke-width="2"/>
  <line x1="396" y1="342" x2="464" y2="342" stroke="#cbc8da" stroke-width="2"/>
  <line x1="396" y1="357" x2="464" y2="357" stroke="#cbc8da" stroke-width="2"/>

  <text x="520" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">every number inside every component,</text>
  <text x="520" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">every score, every counter, and the exact</text>
  <text x="520" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">state of the random number generator</text>

  <!-- the fan to two machines -->
  <line x1="430" y1="377" x2="430" y2="415" stroke="#1b1f2c" stroke-width="2.5"/>
  <line x1="430" y1="415" x2="479" y2="448" stroke="#1b1f2c" stroke-width="2.5"/>
  <polygon points="490,455 476.4,452.0 482.0,443.6" fill="#1b1f2c"/>
  <line x1="430" y1="415" x2="485" y2="558" stroke="#1b1f2c" stroke-width="2.5"/>
  <polygon points="490,570 480.6,559.7 490.0,556.1" fill="#1b1f2c"/>

  <rect x="490" y="425" width="140" height="60" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="560" y="463" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">machine A</text>
  <rect x="630" y="425" width="240" height="60" rx="6" fill="#ffffff" stroke="#e3e1ec" stroke-width="2"/>
  <polyline points="630,459 652,441 674,467 696,447 718,470 740,439 762,461 784,444 806,468 828,450 850,465 870,453" fill="none" stroke="#c2410c" stroke-width="2.5"/>

  <rect x="490" y="540" width="140" height="60" rx="8" fill="#ffffff" stroke="#1b1f2c" stroke-width="2"/>
  <text x="560" y="578" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#1b1f2c">machine B</text>
  <rect x="630" y="540" width="240" height="60" rx="6" fill="#ffffff" stroke="#e3e1ec" stroke-width="2"/>
  <polyline points="630,574 652,556 674,582 696,562 718,585 740,554 762,576 784,559 806,583 828,565 850,580 870,568" fill="none" stroke="#c2410c" stroke-width="2.5"/>

  <!-- the bracket over both continuations -->
  <polyline points="885,425 898,425 898,505 910,512 898,519 898,600 885,600" fill="none" stroke="#626779" stroke-width="2"/>
  <text x="920" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">byte-for-byte</text>
  <text x="920" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">identical to the run</text>
  <text x="920" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1b1f2c">that never stopped</text>

  <!-- caption band -->
  <rect x="90" y="650" width="1020" height="58" rx="8" fill="#ffffff" stroke="#cbc8da" stroke-width="2"/>
  <text x="600" y="687" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1b1f2c">a snapshot is the brain paused, not the brain remembering</text>
</svg>
